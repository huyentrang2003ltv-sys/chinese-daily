<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    
    <!-- Metallic Body Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3F4F6" />
      <stop offset="85%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Head Dome 3D Gradient -->
    <radialGradient id="headDome" cx="38%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>

    <!-- Visor Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Cyan Eye Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </radialGradient>

    <!-- Headphone Cushion Gradient -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Headphone Band Metallic -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with Luxury Glow -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Subtle Ambient Glow Behind Head -->
  <ellipse cx="100" cy="95" rx="58" ry="50" fill="#06B6D4" opacity="0.18" filter="url(#neonGlow)" />

  <!-- HEADPHONE BAND (Behind Head) -->
  <path d="M 40 92 A 62 62 0 0 1 160 92" fill="none" stroke="url(#bandGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 43 90 A 59 59 0 0 1 157 90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />

  <!-- ROBOT BODY / SHOULDERS -->
  <path d="M 62 152 C 62 135, 138 135, 138 152 C 142 168, 148 190, 148 195 L 52 195 C 52 190, 58 168, 62 152 Z" fill="url(#bodyGrad)" />
  <!-- Chest Glow Plate -->
  <rect x="86" y="160" width="28" height="14" rx="7" fill="#0F172A" />
  <rect x="91" y="164" width="18" height="6" rx="3" fill="#06B6D4" filter="url(#neonGlow)" />

  <!-- ROBOT HEAD (Main Smooth 3D Capsule Dome) -->
  <rect x="48" y="46" width="104" height="88" rx="42" fill="url(#headDome)" filter="url(#softShadow)" />
  <!-- Glossy Reflection on Top-Left of Head -->
  <path d="M 64 54 C 80 48, 110 48, 126 53 C 120 58, 76 60, 64 54 Z" fill="#FFFFFF" opacity="0.65" />

  <!-- BLACK VISOR SCREEN -->
  <rect x="58" y="60" width="84" height="58" rx="24" fill="url(#screenGrad)" />
  <rect x="60" y="62" width="80" height="54" rx="22" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5" />
  
  <!-- Visor Glass Reflection Stripe -->
  <path d="M 66 65 L 118 65 C 104 74, 76 74, 66 65 Z" fill="#FFFFFF" opacity="0.18" />

  <!-- GLOWING CYAN EYES (Friendly 3D Happy Arcs or Big Ovals) -->
  <!-- Left Eye -->
  <ellipse cx="82" cy="85" rx="10" ry="13" fill="url(#eyeGlow)" filter="url(#neonGlow)" />
  <circle cx="85" cy="80" r="3.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="80" cy="91" r="1.5" fill="#FFFFFF" opacity="0.7" />

  <!-- Right Eye -->
  <ellipse cx="118" cy="85" rx="10" ry="13" fill="url(#eyeGlow)" filter="url(#neonGlow)" />
  <circle cx="121" cy="80" r="3.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="116" cy="91" r="1.5" fill="#FFFFFF" opacity="0.7" />

  <!-- Cute Glowing Smile -->
  <path d="M 94 99 Q 100 105 106 99" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="71" cy="96" rx="5" ry="3" fill="#FB7185" opacity="0.55" />
  <ellipse cx="129" cy="96" rx="5" ry="3" fill="#FB7185" opacity="0.55" />

  <!-- HEADPHONES (Ear Cushions on Both Sides) -->
  <!-- Left Ear Cushion -->
  <g filter="url(#softShadow)">
    <rect x="34" y="68" width="18" height="46" rx="9" fill="url(#cushionGrad)" />
    <rect x="36" y="72" width="6" height="38" rx="3" fill="#FFFFFF" opacity="0.25" />
    <!-- Outer Headphone Shell -->
    <rect x="29" y="74" width="9" height="34" rx="4" fill="#38BDF8" />
    <circle cx="33" cy="91" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Right Ear Cushion -->
  <g filter="url(#softShadow)">
    <rect x="148" y="68" width="18" height="46" rx="9" fill="url(#cushionGrad)" />
    <rect x="158" y="72" width="6" height="38" rx="3" fill="#FFFFFF" opacity="0.25" />
    <!-- Outer Headphone Shell -->
    <rect x="162" y="74" width="9" height="34" rx="4" fill="#38BDF8" />
    <circle cx="167" cy="91" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Mini Microphone attached to Left Earphone -->
  <path d="M 42 104 C 44 122, 64 128, 76 122" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <circle cx="78" cy="122" r="5" fill="#06B6D4" filter="url(#neonGlow)" />
  <circle cx="78" cy="122" r="2.5" fill="#FFFFFF" />

  <!-- Little Antenna on Head Top -->
  <rect x="97" y="32" width="6" height="15" rx="3" fill="#94A3B8" />
  <circle cx="100" cy="30" r="6" fill="#F43F5E" filter="url(#neonGlow)" />
  <circle cx="100" cy="30" r="2.5" fill="#FFFFFF" />
</svg>
